# 1. HTTP重定向到HTTPS
server {
    listen 80;
    server_name mind-city.com www.mind-city.com mind-city.cn www.mind-city.cn;
    return 301 https://mind-city.com$request_uri;
}

# 2. 主站点配置
server {
    listen 443 ssl;
    server_name mind-city.com;

    # SSL 证书配置
    ssl_certificate /etc/letsencrypt/live/mind-city.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mind-city.com/privkey.pem;

    root /Mind-City/public;
    index index.php;

    # PHP 处理
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 字体文件CORS配置 (需要注释官方规则中配置)
    location ~* \.(woff|woff2|ttf|eot|svg)$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type";
        
        # 缓存和性能优化
        expires 365d;
        access_log off;
        add_header Cache-Control "public";
    }

    # 禁止访问敏感文件
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # 导入 Flarum 官方规则
    include /Mind-City/.nginx.conf;
}

# 3. 其他域名重定向到主站点
server {
    listen 443 ssl;
    server_name www.mind-city.com mind-city.cn www.mind-city.cn;

    # 使用相同的 SSL 证书
    ssl_certificate /etc/letsencrypt/live/mind-city.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mind-city.com/privkey.pem;

    # 跳转到 mind-city.com
    return 301 https://mind-city.com$request_uri;
}
